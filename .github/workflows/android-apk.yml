name: Android APK (self-signed)
on:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 准备 Android SDK / NDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
          echo "NDK_HOME=$SDK/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: android

      - run: pnpm install --frozen-lockfile

      - name: 生成 Android 工程
        run: pnpm tauri android init --ci

      - name: 编译 APK（按 ABI 分包）
        run: pnpm tauri android build --apk --split-per-abi --target aarch64 armv7 x86_64

      - name: 用临时密钥签名
        run: |
          set -euo pipefail
          KS="$RUNNER_TEMP/self.keystore"
          keytool -genkeypair -v -keystore "$KS" -storepass android -keypass android \
            -alias hghub -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=HGhub, OU=Self, O=Self, L=NA, S=NA, C=CN"
          BT="$(ls "$ANDROID_SDK_ROOT/build-tools" | sort -V | tail -1)"
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/$BT/apksigner"
          ZIPALIGN="$ANDROID_SDK_ROOT/build-tools/$BT/zipalign"
          V="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          mkdir -p artifacts
          for f in $(find src-tauri/gen/android/app/build/outputs/apk -name '*release*.apk'); do
            abi="$(basename "$(dirname "$(dirname "$f")")")"
            "$ZIPALIGN" -p -f 4 "$f" "artifacts/HGhub_${V}_${abi}.apk"
            "$APKSIGNER" sign --ks "$KS" --ks-key-alias hghub \
              --ks-pass pass:android --key-pass pass:android \
              --v4-signing-enabled false "artifacts/HGhub_${V}_${abi}.apk"
          done
          ls -lh artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: artifacts/*
          if-no-files-found: error
